<svg
  xmlns="http://www.w3.org/2000/svg"
  width="140"
  height="140"
  viewBox="0 0 64 64"
  fill="none"
  stroke="black"
  stroke-width="3.5"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <!-- Dashboard Container -->
  <rect x="6" y="10" width="52" height="44" rx="6"/>

  <!-- Sidebar -->
  <rect x="10" y="14" width="10" height="36" rx="2"/>

  <!-- Top Cards -->
  <rect x="24" y="14" width="12" height="10" rx="2"/>
  <rect x="40" y="14" width="12" height="10" rx="2"/>

  <!-- Graph Line -->
  <polyline points="26 44 34 36 40 40 50 30"/>

  <!-- Graph Points -->
  <circle cx="26" cy="44" r="2"/>
  <circle cx="34" cy="36" r="2"/>
  <circle cx="40" cy="40" r="2"/>
  <circle cx="50" cy="30" r="2"/>
</svg>